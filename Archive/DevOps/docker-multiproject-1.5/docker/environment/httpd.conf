<VirtualHost _default_:80>
    AllowEncodedSlashes NoDecode
    DocumentRoot "${WORK_DIR}/pub"
    <Directory "${WORK_DIR}/pub">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php:9000"
    </FilesMatch>
</VirtualHost>

<VirtualHost _default_:443>
    AllowEncodedSlashes NoDecode
    DocumentRoot "${WORK_DIR}/pub"

    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/ssl/self-signed.crt"
    SSLCertificateKeyFile "/usr/local/apache2/ssl/self-signed.key"

    Protocols h2 http/1.1

    <Directory "${WORK_DIR}/pub">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php:9000"
    </FilesMatch>
</VirtualHost>

<IfModule mpm_event_module>
    StartServers             3
    MinSpareThreads         75
    MaxSpareThreads        250
    ThreadsPerChild         25
    MaxRequestWorkers      400
    MaxConnectionsPerChild   1000
</IfModule>
